name: Fastapi endpoint CI/CD

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}


            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./Dockerfile.optimized
                tags: ghcr.io/m-talhaansari/techcorp-llm:${{github.sha}}
                load: true
                push: false
                cache-from: type=gha
                cache-to: type=gha,mode=max


            - name: Scan Docker image with Trivy
              run: |
                docker run --rm \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    aquasec/trivy:0.65.0 \
                    image \
                    --severity HIGH,CRITICAL \
                    --exit-code 0 \
                    techcorp-llm:${{ github.sha }}

            - name: Push Docker image
              run: |
                docker tag techcorp-llm:${{github.sha}} \
                    ghcr.io/m-talhaansari/techcorp-llm:${{github.sha}}

                docker push \
                    ghcr.io/m-talhaansari/techcorp-llm:${{github.sha}}

                
            # Blue Green Deployment
            - name: Deploy Green Environment
              run: |
                echo "+========+"
                echo "BLUE_GREEN DEPLOYMENT"
                echo "+========+"
                echo "Current Environment: BLUE"
                echo "New Environment: Green"
                echo "Image: ghcr.io/m-talhaansari/techcorp-llm:${{github.sha}}"
                echo ""
                echo "Deploying new version to GREEN"
                echo "GREEN Deployment started"

            - name: GREEN Environment Health Check
              run: |
                echo "Cheching GREEN environment health...."

                # simulated health check
                HEALTH_STATUS="healthy"

                if [ "$HEALTH_STATUS" = "healthy"]; then
                    echo "GREEN environment is healthy."
                    echo "Health check passed"
                else
                    echo "Green environment health check failed"
                    exit 1
                fi

            - name: Swith traffic to Green
              if: success()
              run: |
                echo "GREEN environment passed halth checks."
                echo "Switching traffic from BLUE to GREEN"
                echo "Traffic successfully switched to green"

            - name: Rollback to blue
              if: failure()
              run: |
                echo "Green deployment failed"
                echo "Rolling back traffic to BLUE"
                echo "ROLLBACK completed"
                exit 1
            
            - name: Deployment Notification
              if: always()
              run: |
                if ["${{job.status}}" = "success"]; then
                  echo "Deployment successful"
                  echo "Active environment: GREEN"
                else
                  echo "DEPLOYMENT FAILED"
                  ECHO "ACTIVE ENVIRONMENT: BLUE"
                FI




