name: Fastapi endpoint CI/CD

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build Docker image
              run: |
                docker build \
                    -f Dockerfile.optimized \
                    -t techcory-llm:${{github.sha }} .
