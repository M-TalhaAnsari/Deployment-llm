
name: Fastapi endpoint CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Login to GitHub Container Registry
      # ============================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 3. Setup Docker Buildx
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # 4. Build Docker image
      # ============================================================
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.optimized
          tags: ghcr.io/m-talhaansari/techcorp-llm:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # 5. Scan Docker image with Trivy
      # ============================================================
      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ghcr.io/m-talhaansari/techcorp-llm:${{ github.sha }}

      # ============================================================
      # 6. Push Docker image
      # ============================================================
      - name: Push Docker image
        run: |
          docker push ghcr.io/m-talhaansari/techcorp-llm:${{ github.sha }}

      # ============================================================
      # 7. Deploy Green Environment
      # ============================================================
      - name: Deploy Green Environment
        run: |
          echo "========================================"
          echo "       BLUE-GREEN DEPLOYMENT"
          echo "========================================"
          echo "Current Environment: BLUE"
          echo "New Environment: GREEN"
          echo "Image: ghcr.io/m-talhaansari/techcorp-llm:${{ github.sha }}"
          echo ""
          echo "Deploying new version to GREEN..."
          echo "GREEN deployment started successfully."

      # ============================================================
      # 8. GREEN Health Check
      # ============================================================
      - name: GREEN Environment Health Check
        run: |
          echo "Checking GREEN environment health..."

          # Simulated health check
          HEALTH_STATUS="healthy"

          if [ "$HEALTH_STATUS" = "healthy" ]; then
            echo "GREEN environment is healthy."
            echo "Health check passed."
          else
            echo "GREEN environment health check failed."
            exit 1
          fi

      # ============================================================
      # 9. Switch Traffic to GREEN
      # ============================================================
      - name: Switch traffic to Green
        if: success()
        run: |
          echo "GREEN environment passed health checks."
          echo "Switching traffic from BLUE to GREEN..."
          echo "Traffic successfully switched to GREEN."

      # ============================================================
      # 10. Rollback to BLUE if deployment fails
      # ============================================================
      - name: Rollback to BLUE
        if: failure()
        run: |
          echo "GREEN deployment failed."
          echo "Rolling back traffic to BLUE..."
          echo "ROLLBACK completed."

      # ============================================================
      # 11. Deployment Notification
      # ============================================================
      - name: Deployment Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "========================================"
            echo "       DEPLOYMENT SUCCESSFUL"
            echo "========================================"
            echo "Active environment: GREEN"
          else
            echo "========================================"
            echo "       DEPLOYMENT FAILED"
            echo "========================================"
            echo "Active environment: BLUE"
          fi
